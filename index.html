<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop-watch</title>
    <style>
        ::selection {
            background-color: black;
            color: blue;
        }

        .container {
            height: 100vh;
            width: 100%;
            background-image: linear-gradient(black);
            filter: brightness(100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h1 {
            word-spacing: 13px;

        }

        h1,
        h2 {
            color: white;
            font-weight: 400;
            font-family: Arial, Helvetica, sans-serif;
        }

        h2 {
            font-size: 41px;
            margin-bottom: px;
        }

        button {
            border: 0;
            margin: 10px;
            padding: 8px 15px;
            box-sizing: border-box;
            font-weight: 600;
        }

        button:hover {
            box-shadow: 1px 1px 2px white;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>STOP WATCH</h1>
        <div class="time">
            <h2 id="timer-display">00:00:00</h2>
        </div>
        <div class="buttons">
            <button onclick="start()">START</button>
            <button onclick="stop()">STOP</button>
            <button onclick="reset()">RESET</button>
        </div>
    </div>

    <script src="./app.js">



    </script>
</body>

</html>
